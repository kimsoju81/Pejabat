name: Bina Pejabat TWA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v5

      - name: Sediakan Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Sediakan Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pasang Android Command-line Tools & SDK
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm cmdline-tools.zip

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Pasang Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Jana Keystore Tandatangan APK
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -alias pejabatkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pejabat123 \
            -keypass pejabat123 \
            -dname "CN=Pejabat, OU=Development, O=Pejabat, L=Melaka, ST=Melaka, C=MY"

      - name: Cipta konfigurasi Bubblewrap & Bina APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twa-project"
          cd "$GITHUB_WORKSPACE/twa-project"

          if [ -z "${JAVA_HOME:-}" ]; then
            JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
            export JAVA_HOME
          fi

          # Cuba init dengan input terhad (maksimum 30 baris 'n' sahaja, bukan 'yes' tanpa had)
          {
            printf 'n\n%s\nn\n%s\n' "$JAVA_HOME" "$ANDROID_HOME"
            printf 'n\n%.0s' {1..25}
          } | bubblewrap init \
            --manifest="https://kimsoju81.github.io/Pejabat/manifest.json" \
            --directory="." || true

          # Jika twa-manifest.json belum wujud, jana secara terus daripada manifest.json
          if [ ! -f "$GITHUB_WORKSPACE/twa-project/twa-manifest.json" ]; then
            echo "Menjana twa-manifest.json secara automatik..."
            node -e '
              (async () => {
                const res = await fetch("https://kimsoju81.github.io/Pejabat/manifest.json");
                const m = await res.json();
                const startUrl = new URL(m.start_url || "/", "https://kimsoju81.github.io/Pejabat/").toString();
                const iconUrl = (m.icons && m.icons[0] && m.icons[0].src)
                  ? new URL(m.icons[0].src, "https://kimsoju81.github.io/Pejabat/").toString()
                  : "https://kimsoju81.github.io/Pejabat/icon-512.png";
                const twa = {
                  packageId: "org.pejabat.app",
                  host: "kimsoju81.github.io",
                  name: m.name || "Pejabat",
                  launcherName: m.short_name || "Pejabat",
                  display: m.display || "standalone",
                  themeColor: m.theme_color || "#001F3F",
                  themeColorDark: "#001F3F",
                  navigationColor: "#000000",
                  navigationColorDark: "#000000",
                  navigationDividerColor: "#000000",
                  navigationDividerColorDark: "#000000",
                  backgroundColor: m.background_color || "#FFFFFF",
                  enableNotifications: true,
                  startUrl: new URL(m.start_url || "/", "https://kimsoju81.github.io/Pejabat/").pathname,
                  iconUrl: iconUrl,
                  maskableIconUrl: iconUrl,
                  splashScreenFadeOutDuration: 300,
                  signingKey: {
                    path: process.env.GITHUB_WORKSPACE + "/android.keystore",
                    alias: "pejabatkey"
                  },
                  appVersionName: "1.0.0",
                  appVersionCode: 1,
                  shortcuts: [],
                  generatorApp: "bubblewrap-cli",
                  webManifestUrl: "https://kimsoju81.github.io/Pejabat/manifest.json",
                  fallbackType: "customtabs",
                  features: {},
                  alphaDependencies: { enabled: false },
                  enableSiteSettingsShortcut: true,
                  isChromeOSOnly: false,
                  isMetaQuest: false,
                  minSdkVersion: 21,
                  orientation: m.orientation || "default",
                  fingerprints: [],
                  additionalTrustedOrigins: [],
                  retainedHashes: [],
                  protocolHandlers: [],
                  fileHandlers: [],
                  launchHandlerClientMode: "",
                  displayOverride: [],
                  appVersion: "1.0.0"
                };
                require("fs").writeFileSync("twa-manifest.json", JSON.stringify(twa, null, 2));
              })();
            '
            bubblewrap update --skipPwaValidation || true
          fi

          bubblewrap build --skipPwaValidation


      - name: Muat Naik Fail APK sebagai Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Pejabat-Android-APK
          path: twa-project/**/*.apk
