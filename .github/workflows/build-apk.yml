name: Bina Pejabat TWA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v5

      - name: Sediakan Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Sediakan Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pasang Android Command-line Tools & SDK
        run: |
          set -e
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          rm -f cmdline-tools.zip
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          chmod -R +x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          (printf 'y\n%.0s' {1..50}) | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          (printf 'y\n%.0s' {1..50}) | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Pasang Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Jana Keystore Tandatangan APK
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/android.keystore" -alias pejabatkey -keyalg RSA -keysize 2048 -validity 10000 -storepass pejabat123 -keypass pejabat123 -dname "CN=Pejabat, OU=Development, O=Pejabat, L=Melaka, ST=Melaka, C=MY"

      - name: Bina Projek Android & APK
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/twa-project/app/src/main/java/org/pejabat/app" "$GITHUB_WORKSPACE/twa-project/app/src/main/res/values"
          cd "$GITHUB_WORKSPACE/twa-project"
          export ANDROID_HOME="$HOME/android-sdk"
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
          printf "rootProject.name = 'PejabatTWA'\ninclude ':app'\n" > settings.gradle
          printf "buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath 'com.android.tools.build:gradle:8.1.4'\n    }\n}\n\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n" > build.gradle
          printf "plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    namespace 'org.pejabat.app'\n    compileSdk 34\n\n    defaultConfig {\n        applicationId \"org.pejabat.app\"\n        minSdk 21\n        targetSdk 34\n        versionCode 1\n        versionName \"1.0.0\"\n    }\n\n    signingConfigs {\n        release {\n            storeFile file(\"%s/android.keystore\")\n            storePassword \"pejabat123\"\n            keyAlias \"pejabatkey\"\n            keyPassword \"pejabat123\"\n        }\n    }\n\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false\n        }\n    }\n\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\n" "$GITHUB_WORKSPACE" > app/build.gradle
          printf "<resources>\n    <string name=\"app_name\">Pejabat</string>\n</resources>\n" > app/src/main/res/values/strings.xml
          printf "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n    <application android:allowBackup=\"true\" android:label=\"@string/app_name\" android:supportsRtl=\"true\" android:usesCleartextTraffic=\"true\" android:theme=\"@android:style/Theme.DeviceDefault.Light.NoActionBar\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\" android:configChanges=\"orientation|screenSize|keyboardHidden\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n" > app/src/main/AndroidManifest.xml
          printf "package org.pejabat.app;\n\nimport android.app.Activity;\nimport android.graphics.Color;\nimport android.os.Bundle;\nimport android.webkit.WebChromeClient;\nimport android.webkit.WebSettings;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\npublic class MainActivity extends Activity {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        WebView webView = new WebView(this);\n        webView.setBackgroundColor(Color.WHITE);\n        WebSettings settings = webView.getSettings();\n        settings.setJavaScriptEnabled(true);\n        settings.setDomStorageEnabled(true);\n        settings.setDatabaseEnabled(true);\n        settings.setLoadWithOverviewMode(true);\n        settings.setUseWideViewPort(true);\n        settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);\n        webView.setWebChromeClient(new WebChromeClient());\n        webView.setWebViewClient(new WebViewClient());\n        setContentView(webView);\n        webView.loadUrl(\"https://pejabat.ai.studio/\");\n    }\n}\n" > app/src/main/java/org/pejabat/app/MainActivity.java
          rm -rf /opt/gradle/gradle-8.4 gradle.zip
          mkdir -p /opt/gradle
          curl -fsSL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /opt/gradle
          rm -f gradle.zip
          chmod +x /opt/gradle/gradle-8.4/bin/gradle
          /opt/gradle/gradle-8.4/bin/gradle assembleRelease --no-daemon

      - name: Muat Naik Fail APK sebagai Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Pejabat-Android-APK
          path: twa-project/**/*.apk
