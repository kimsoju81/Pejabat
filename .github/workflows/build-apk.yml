      - name: Cipta konfigurasi Bubblewrap & Bina APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twa-project"
          cd "$GITHUB_WORKSPACE/twa-project"

          # Pastikan JAVA_HOME merujuk kepada JDK 17 yang dipasang oleh setup-java
          if [ -z "${JAVA_HOME:-}" ]; then
            JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
            export JAVA_HOME
          fi

          # Bekalkan jawapan 'n' untuk soalan interaktif serta laluan JDK & SDK jika diminta
          {
            printf 'n\n'
            printf '%s\n' "$JAVA_HOME"
            printf 'n\n'
            printf '%s\n' "$ANDROID_HOME"
            yes "n" | head -n 20
          } | bubblewrap init \
            --manifest="https://kimsoju81.github.io/Pejabat/manifest.json" \
            --directory="."

          bubblewrap build --skipPwaValidation
