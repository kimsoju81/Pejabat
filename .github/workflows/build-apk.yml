name: Bina Pejabat TWA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v5

      - name: Sediakan Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Sediakan Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pasang Android Command-line Tools & SDK
        run: |
          set -e
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          rm -f cmdline-tools.zip

          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi

          chmod -R +x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"

          (printf 'y\n%.0s' {1..50}) | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          (printf 'y\n%.0s' {1..50}) | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Pasang Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Jana Keystore Tandatangan APK
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -alias pejabatkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pejabat123 \
            -keypass pejabat123 \
            -dname "CN=Pejabat, OU=Development, O=Pejabat, L=Melaka, ST=Melaka, C=MY"

      - name: Cipta konfigurasi Bubblewrap & Bina APK
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/twa-project" "$HOME/.bubblewrap"
          cd "$GITHUB_WORKSPACE/twa-project"

          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$HOME/android-sdk"

          if [ -z "${JAVA_HOME:-}" ]; then
            JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
            export JAVA_HOME
          fi

          cat <<EOF > "$HOME/.bubblewrap/config.json"
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME",
            "sdkPath": "$ANDROID_HOME"
          }
          EOF

          node -e '
            (async () => {
              let m = {};
              try {
                const res = await fetch("https://pejabat.ai.studio/manifest.json");
                const rawText = await res.text();
                const cleaned = rawText.replace(/,\s*([\]}])/g, "$1");
                m = JSON.parse(cleaned);
              } catch (err) {
                console.warn("Amaran: manifest.json tidak sah atau tidak ditemui, guna tetapan lalai:", err.message);
              }

              const baseUrl = "https://pejabat.ai.studio/";
              let startPath = "/";
              try {
                startPath = new URL(m.start_url || "/", baseUrl).pathname;
              } catch (_) {
                startPath = "/";
              }

              let iconUrl = baseUrl + "icon-512.png";
              try {
                if (Array.isArray(m.icons) && m.icons.length > 0 && m.icons[0]?.src) {
                  iconUrl = new URL(m.icons[0].src, baseUrl).toString();
                }
              } catch (_) {
                iconUrl = baseUrl + "icon-512.png";
              }

              const twa = {
                packageId: "org.pejabat.app",
                host: "pejabat.ai.studio",
                name: typeof m.name === "string" && m.name.trim() ? m.name.trim() : "Pejabat",
                launcherName: typeof m.short_name === "string" && m.short_name.trim() ? m.short_name.trim() : "Pejabat",
                display: typeof m.display === "string" ? m.display : "standalone",
                themeColor: typeof m.theme_color === "string" ? m.theme_color : "#001F3F",
                themeColorDark: "#001F3F",
                navigationColor: "#000000",
                navigationColorDark: "#000000",
                navigationDividerColor: "#000000",
                navigationDividerColorDark: "#000000",
                backgroundColor: typeof m.background_color === "string" ? m.background_color : "#FFFFFF",
                enableNotifications: true,
                startUrl: startPath,
                iconUrl: iconUrl,
                maskableIconUrl: iconUrl,
                splashScreenFadeOutDuration: 300,
                signingKey: {
                  path: process.env.GITHUB_WORKSPACE + "/android.keystore",
                  alias: "pejabatkey"
                },
                appVersionName: "1.0.0",
                appVersionCode: 1,
                shortcuts: [],
                generatorApp: "bubblewrap-cli",
                webManifestUrl: "https://pejabat.ai.studio/manifest.json",
                fallbackType: "customtabs",
                features: {},
                alphaDependencies: { enabled: false },
                enableSiteSettingsShortcut: true,
                isChromeOSOnly: false,
                isMetaQuest: false,
                minSdkVersion: 21,
                orientation: typeof m.orientation === "string" ? m.orientation : "default",
                fingerprints: [],
                additionalTrustedOrigins: [],
                retainedHashes: [],
                protocolHandlers: [],
                fileHandlers: [],
                launchHandlerClientMode: "",
                displayOverride: [],
                appVersion: "1.0.0"
              };

              require("fs").writeFileSync("twa-manifest.json", JSON.stringify(twa, null, 2));
            })();
          '

          if bubblewrap build \
            --skipPwaValidation \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="$ANDROID_HOME"; then
            echo "Bubblewrap build berjaya."
          else
            echo "Bubblewrap build gagal pada semakan SDK, mencipta projek Android & membina APK melalui Gradle 8.4..."
            mkdir -p \
              app/src/main/java/org/pejabat/app \
              app/src/main/res/values \
              app/src/main/res/mipmap-mdpi \
              app/src/main/res/mipmap-hdpi \
              app/src/main/res/mipmap-xhdpi \
              app/src/main/res/mipmap-xxhdpi \
              app/src/main/res/mipmap-xxxhdpi

            curl -fsSL "https://pejabat.ai.studio/icon-512.png" -o icon_source.png || true

            ICON_ATTRS=""
            if [ -s icon_source.png ] && command -v convert >/dev/null 2>&1; then
              convert icon_source.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
              convert icon_source.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
              convert icon_source.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
              convert icon_source.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
              convert icon_source.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
              cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
              cp app/src/main/res/mipmap-xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
              cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
              cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
              ICON_ATTRS='android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"'
            fi

            printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
            printf "rootProject.name = 'PejabatTWA'\ninclude ':app'\n" > settings.gradle

            cat <<EOF > build.gradle
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
EOF

            cat <<EOF > app/build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace 'org.pejabat.app'
    compileSdk 34

    defaultConfig {
        applicationId "org.pejabat.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file("$GITHUB_WORKSPACE/android.keystore")
            storePassword "pejabat123"
            keyAlias "pejabatkey"
            keyPassword "pejabat123"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
EOF

            cat <<'EOF' > app/src/main/res/values/strings.xml
<resources>
    <string name="app_name">Pejabat</string>
</resources>
EOF

            cat <<EOF > app/src/main/AndroidManifest.xml
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <application
        android:allowBackup="true"
        $ICON_ATTRS
        android:label="@string/app_name"
        android:supportsRtl="true"
        android:usesCleartextTraffic="true"
        android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:configChanges="orientation|screenSize|keyboardHidden">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF

            cat <<'EOF' > app/src/main/java/org/pejabat/app/MainActivity.java
package org.pejabat.app;

import android.app.Activity;
import android.graphics.Color;
import android.os.Bundle;
import android.os.Handler;
import android.os.Looper;
import android.webkit.WebChromeClient;
import android.webkit.WebResourceError;
import android.webkit.WebResourceRequest;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;

public class MainActivity extends Activity {
    private boolean pageLoaded = false;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        final WebView webView = new WebView(this);
        webView.setBackgroundColor(Color.WHITE);
        WebSettings settings = webView.getSettings();
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setDatabaseEnabled(true);
        settings.setLoadWithOverviewMode(true);
        settings.setUseWideViewPort(true);
        settings.setCacheMode(WebSettings.LOAD_DEFAULT);
        settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
        webView.setWebChromeClient(new WebChromeClient());
        webView.setWebViewClient(new WebViewClient() {
            @Override
            public void onPageFinished(WebView view, String url) {
                super.onPageFinished(view, url);
                pageLoaded = true;
            }
            @Override
            public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                view.loadUrl(request.getUrl().toString());
                return true;
            }
            @Override
            public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                if (request.isForMainFrame()) {
                    pageLoaded = true;
                    String html = "<html><body style='font-family:Arial,sans-serif;padding:24px;color:#000;background:#fff;'>" +
                        "<h3 style='color:#001F3F;'>Pejabat</h3>" +
                        "<p>Ralat memuatkan: " + error.getDescription() + "</p>" +
                        "<p>URL: https://pejabat.ai.studio/</p>" +
                        "</body></html>";
                    view.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
                }
            }
        });
        setContentView(webView);
        webView.loadUrl("https://pejabat.ai.studio/");

        new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
            @Override
            public void run() {
                if (!pageLoaded) {
                    String html = "<html><body style='font-family:Arial,sans-serif;padding:24px;color:#000;background:#fff;'>" +
                        "<h3 style='color:#001F3F;'>Pejabat</h3>" +
                        "<p>Sedang menyambung ke https://pejabat.ai.studio/...</p>" +
                        "<p>Jika skrin kekal di sini, periksa sambungan internet atau status laman web.</p>" +
                        "</body></html>";
                    webView.loadDataWithBaseURL("https://pejabat.ai.studio/", html, "text/html", "UTF-8", null);
                }
            }
        }, 6000);
    }
}
EOF

            rm -rf /opt/gradle/gradle-8.4 gradle.zip
            mkdir -p /opt/gradle
            curl -fsSL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
            unzip -q gradle.zip -d /opt/gradle
            rm -f gradle.zip
            chmod +x /opt/gradle/gradle-8.4/bin/gradle

            /opt/gradle/gradle-8.4/bin/gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Muat Naik Fail APK sebagai Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Pejabat-Android-APK
          path: twa-project/**/*.apk
