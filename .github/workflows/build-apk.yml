name: Bina Pejabat TWA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v5

      - name: Sediakan Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Sediakan Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pasang Android Command-line Tools & SDK
        run: |
          set -e
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          rm -f cmdline-tools.zip

          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi

          chmod -R +x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"

          (printf 'y\n%.0s' {1..50}) | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          (printf 'y\n%.0s' {1..50}) | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Pasang Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Jana Keystore Tandatangan APK
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -alias pejabatkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pejabat123 \
            -keypass pejabat123 \
            -dname "CN=Pejabat, OU=Development, O=Pejabat, L=Melaka, ST=Melaka, C=MY"

      - name: Cipta konfigurasi Bubblewrap & Bina APK
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/twa-project" "$HOME/.bubblewrap"
          cd "$GITHUB_WORKSPACE/twa-project"

          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$HOME/android-sdk"

          if [ -z "${JAVA_HOME:-}" ]; then
            JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
            export JAVA_HOME
          fi

          cat <<EOF > "$HOME/.bubblewrap/config.json"
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME",
            "sdkPath": "$ANDROID_HOME"
          }
          EOF

          node -e '
            (async () => {
              let m = {};
              try {
                const res = await fetch("https://kimsoju81.github.io/Pejabat/manifest.json");
                const rawText = await res.text();
                const cleaned = rawText.replace(/,\s*([\]}])/g, "$1");
                m = JSON.parse(cleaned);
              } catch (err) {
                console.warn("Amaran: manifest.json tidak sah, guna tetapan lalai:", err.message);
              }

              const baseUrl = "https://kimsoju81.github.io/Pejabat/";
              let startPath = "/";
              try {
                startPath = new URL(m.start_url || "/", baseUrl).pathname;
              } catch (_) {
                startPath = "/";
              }

              let iconUrl = baseUrl + "icon-512.png";
              try {
                if (Array.isArray(m.icons) && m.icons.length > 0 && m.icons[0]?.src) {
                  iconUrl = new URL(m.icons[0].src, baseUrl).toString();
                }
              } catch (_) {
                iconUrl = baseUrl + "icon-512.png";
              }

              const twa = {
                packageId: "org.pejabat.app",
                host: "kimsoju81.github.io",
                name: typeof m.name === "string" && m.name.trim() ? m.name.trim() : "Pejabat",
                launcherName: typeof m.short_name === "string" && m.short_name.trim() ? m.short_name.trim() : "Pejabat",
                display: typeof m.display === "string" ? m.display : "standalone",
                themeColor: typeof m.theme_color === "string" ? m.theme_color : "#001F3F",
                themeColorDark: "#001F3F",
                navigationColor: "#000000",
                navigationColorDark: "#000000",
                navigationDividerColor: "#000000",
                navigationDividerColorDark: "#000000",
                backgroundColor: typeof m.background_color === "string" ? m.background_color : "#FFFFFF",
                enableNotifications: true,
                startUrl: startPath,
                iconUrl: iconUrl,
                maskableIconUrl: iconUrl,
                splashScreenFadeOutDuration: 300,
                signingKey: {
                  path: process.env.GITHUB_WORKSPACE + "/android.keystore",
                  alias: "pejabatkey"
                },
                appVersionName: "1.0.0",
                appVersionCode: 1,
                shortcuts: [],
                generatorApp: "bubblewrap-cli",
                webManifestUrl: "https://kimsoju81.github.io/Pejabat/manifest.json",
                fallbackType: "customtabs",
                features: {},
                alphaDependencies: { enabled: false },
                enableSiteSettingsShortcut: true,
                isChromeOSOnly: false,
                isMetaQuest: false,
                minSdkVersion: 21,
                orientation: typeof m.orientation === "string" ? m.orientation : "default",
                fingerprints: [],
                additionalTrustedOrigins: [],
                retainedHashes: [],
                protocolHandlers: [],
                fileHandlers: [],
                launchHandlerClientMode: "",
                displayOverride: [],
                appVersion: "1.0.0"
              };

              require("fs").writeFileSync("twa-manifest.json", JSON.stringify(twa, null, 2));
            })();
          '

          if bubblewrap build \
            --skipPwaValidation \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="$ANDROID_HOME"; then
            echo "Bubblewrap build berjaya."
          else
            echo "Bubblewrap build gagal pada semakan SDK, mencipta projek Android & membina APK melalui Gradle 8.4..."
            mkdir -p app/src/main/java/org/pejabat/app app/src/main/res/values

            printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
            printf "rootProject.name = 'PejabatTWA'\ninclude ':app'\n" > settings.gradle

            printf "buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath 'com.android.tools.build:gradle:8.1.4'\n    }\n}\n\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n" > build.gradle

            printf "plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    namespace 'org.pejabat.app'\n    compileSdk 34\n\n    defaultConfig {\n        applicationId \"org.pejabat.app\"\n        minSdk 21\n        targetSdk 34\n        versionCode 1\n        versionName \"1.0.0\"\n    }\n\n    signingConfigs {\n        release {\n            storeFile file(\"%s/android.keystore\")\n            storePassword \"pejabat123\"\n            keyAlias \"pejabatkey\"\n            keyPassword \"pejabat123\"\n        }\n    }\n\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false\n        }\n    }\n\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\n" "$GITHUB_WORKSPACE" > app/build.gradle

            printf "<resources>\n    <string name=\"app_name\">Pejabat</string>\n</resources>\n" > app/src/main/res/values/strings.xml

            printf "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application\n        android:allowBackup=\"true\"\n        android:label=\"@string/app_name\"\n        android:supportsRtl=\"true\"\n        android:theme=\"@android:style/Theme.DeviceDefault.Light.NoActionBar\">\n        <activity\n            android:name=\".MainActivity\"\n            android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n" > app/src/main/AndroidManifest.xml

            printf "package org.pejabat.app;\n\nimport android.app.Activity;\nimport android.os.Bundle;\nimport android.webkit.WebSettings;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\npublic class MainActivity extends Activity {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        WebView webView = new WebView(this);\n        WebSettings settings = webView.getSettings();\n        settings.setJavaScriptEnabled(true);\n        settings.setDomStorageEnabled(true);\n        webView.setWebViewClient(new WebViewClient());\n        setContentView(webView);\n        webView.loadUrl(\"https://kimsoju81.github.io/Pejabat/\");\n    }\n}\n" > app/src/main/java/org/pejabat/app/MainActivity.java

            rm -rf /opt/gradle/gradle-8.4 gradle.zip
            mkdir -p /opt/gradle
            curl -fsSL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
            unzip -q gradle.zip -d /opt/gradle
            rm -f gradle.zip
            chmod +x /opt/gradle/gradle-8.4/bin/gradle

            /opt/gradle/gradle-8.4/bin/gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Muat Naik Fail APK sebagai Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Pejabat-Android-APK
          path: twa-project/**/*.apk
