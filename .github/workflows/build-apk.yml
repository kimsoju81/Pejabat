name: Bina Pejabat TWA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Sediakan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sediakan Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sediakan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Jana Keystore Tandatangan APK
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -alias pejabatkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pejabat123 \
            -keypass pejabat123 \
            -dname "CN=Pejabat, OU=Development, O=Pejabat, L=Melaka, ST=Melaka, C=MY"

      - name: Cipta konfigurasi Bubblewrap & Bina APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twa-project"
          cd "$GITHUB_WORKSPACE/twa-project"
          printf '\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n' | bubblewrap init \
            --manifest="https://kimsoju81.github.io/Pejabat/manifest.json" \
            --directory="." \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="$ANDROID_HOME" \
            --signingKeyPath="$GITHUB_WORKSPACE/android.keystore" \
            --signingKeyAlias="pejabatkey" \
            --storePassword="pejabat123" \
            --keyPassword="pejabat123"
          bubblewrap build --skipPwaValidation

      - name: Muat Naik Fail APK sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pejabat-Android-APK
          path: twa-project/**/*.apk
          
