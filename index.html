    <script>
      (function () {
        if (typeof globalThis.Iterator === 'undefined') {
          var iterProto = Object.getPrototypeOf(
            Object.getPrototypeOf([][Symbol.iterator]())
          );
          function Iterator() {}
          Iterator.prototype = iterProto;
          try {
            Object.defineProperty(iterProto, 'constructor', {
              value: Iterator,
              writable: true,
              configurable: true,
            });
          } catch (_) {}
          Iterator.from = function (iterable) {
            if (iterable == null) {
              throw new TypeError('Cannot convert undefined or null to iterator');
            }
            if (typeof iterable[Symbol.iterator] === 'function') {
              return iterable[Symbol.iterator]();
            }
            if (typeof iterable.next === 'function') {
              return iterable;
            }
            throw new TypeError('Object is not iterable');
          };
          globalThis.Iterator = Iterator;
        }

        var proto = globalThis.Iterator && globalThis.Iterator.prototype;
        if (!proto) return;

        function defineHelper(name, fn) {
          if (typeof proto[name] !== 'function') {
            try {
              Object.defineProperty(proto, name, {
                value: fn,
                writable: true,
                configurable: true,
              });
            } catch (_) {
              proto[name] = fn;
            }
          }
        }

        defineHelper('toArray', function () {
          var res = [];
          var step;
          while (!(step = this.next()).done) {
            res.push(step.value);
          }
          return res;
        });

        defineHelper('forEach', function (fn) {
          var idx = 0;
          var step;
          while (!(step = this.next()).done) {
            fn(step.value, idx++);
          }
        });

        defineHelper('map', function* (fn) {
          var idx = 0;
          var step;
          while (!(step = this.next()).done) {
            yield fn(step.value, idx++);
          }
        });

        defineHelper('filter', function* (fn) {
          var idx = 0;
          var step;
          while (!(step = this.next()).done) {
            if (fn(step.value, idx++)) {
              yield step.value;
            }
          }
        });

        defineHelper('take', function* (limit) {
          var remaining = Number(limit);
          if (isNaN(remaining) || remaining <= 0) return;
          var step;
          while (remaining > 0 && !(step = this.next()).done) {
            remaining--;
            yield step.value;
          }
        });

        defineHelper('drop', function* (limit) {
          var remaining = Math.max(0, Number(limit) || 0);
          var step;
          while (remaining > 0 && !(step = this.next()).done) {
            remaining--;
          }
          while (!(step = this.next()).done) {
            yield step.value;
          }
        });

        defineHelper('some', function (fn) {
          var idx = 0;
          var step;
          while (!(step = this.next()).done) {
            if (fn(step.value, idx++)) return true;
          }
          return false;
        });

        defineHelper('every', function (fn) {
          var idx = 0;
          var step;
          while (!(step = this.next()).done) {
            if (!fn(step.value, idx++)) return false;
          }
          return true;
        });

        defineHelper('find', function (fn) {
          var idx = 0;
          var step;
          while (!(step = this.next()).done) {
            if (fn(step.value, idx++)) return step.value;
          }
          return undefined;
        });

        defineHelper('reduce', function (fn, initialValue) {
          var hasInitial = arguments.length >= 2;
          var acc = initialValue;
          var idx = 0;
          var step;
          if (!hasInitial) {
            step = this.next();
            if (step.done) {
              throw new TypeError('Reduce of empty iterator with no initial value');
            }
            acc = step.value;
            idx = 1;
          }
          while (!(step = this.next()).done) {
            acc = fn(acc, step.value, idx++);
          }
          return acc;
        });
      })();
    </script>
